global:
  resolve_timeout: 5m

route:
  receiver: discord
  group_by:
    - alertname
    - instance
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity="critical"
      receiver: discord
      repeat_interval: 1h

    - matchers:
        - severity="warning"
      receiver: discord
      repeat_interval: 4h

receivers:
  - name: discord
    discord_configs:
      - webhook_url_file: /etc/alertmanager/discord.txt
        send_resolved: true
        title: >-
          {{ if eq .Status "firing" }}🚨{{ else }}✅{{ end }}
          {{ .CommonLabels.alertname }}
        message: >-
          {{ range .Alerts }}
          **{{ .Annotations.summary }}**
          {{ .Annotations.description }}
          {{ end }}
        content: "<@282946255389327360>"

