groups:
  - name: infrastructure
    rules:
      - alert: HostDown
        expr: up{job="node"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Host {{ $labels.host }} is down"
          description: "Host {{ $labels.host }} is unreachable, and/or metrics cannot be retrieved"

      - alert: HighCPU
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage on {{ $labels.instance }}"
          description: "CPU usage is high (>90%) for more than 5 minutes"

      - alert: LowMemory
        expr: |
          node_memory_MemAvailable_bytes
          / node_memory_MemTotal_bytes * 100 < 15
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Low memory on {{ $labels.instance }}"
          description: "Available memory is below 15% (currently {{ $value | printf \"%.1f\" }}%)."

      - alert: CriticalMemory
        expr: |
          node_memory_MemAvailable_bytes
          / node_memory_MemTotal_bytes * 100 < 5
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "LOW LOW memory on {{ $labels.instance }}"
          description: "Available memory is below 5% (currently {{ $value | printf \"%.1f\" }}%)."

