global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/rules/*.yml
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
  - job_name: proxmox
    static_configs:
      - targets:
          - 192.168.1.122:9221
    metrics_path: /pve
  - job_name: node
    file_sd_configs:
      - files: 
        - /etc/prometheus/targets/servers.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093
