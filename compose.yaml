services:
  grafana:
    image: grafana/grafana:latest
    container_name: alx-grafana
    restart: unless-stopped
    environment:
      - TERM=linux
      - GF_PLUGINS_PREINSTALL=grafana-clock-panel,grafana-polystat-panel
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_storage:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: alx-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus_storage:/prometheus
    networks:
      - monitoring
  alertmanager:
    image: prom/alertmanager:latest
    container_name: alx-alertmanager
    restart: unless-stopped
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./secrets/discord.txt:/etc/alertmanager/discord.txt:ro
      - alertmanager_storage:/alertmanager
    networks:
      - monitoring
  gatus:
    image: twinproduction/gatus:stable
    container_name: alx-gatus
    restart: unless-stopped
    env_file: secrets/gatus.env
    ports:
      - "127.0.0.1:3001:8080"
    volumes:
      - ./gatus:/config:ro
    networks:
      - monitoring
  cadvisor:
    image: ghcr.io/google/cadvisor:latest
    container_name: alx-cadvisor
    restart: unless-stopped
    ports:
      - "127.0.0.1:3002:8080"
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    networks:
      - monitoring
volumes:
  grafana_storage: {}
  prometheus_storage: {}
  alertmanager_storage: {}
networks:
  monitoring: {}
